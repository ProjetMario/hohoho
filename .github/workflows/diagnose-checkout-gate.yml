name: Diagnostiquer le verrou Checkout HoHoHo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-checkout-gate.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Envoyer uniquement des requêtes invalides sans création de paiement
        run: |
          node --input-type=module <<'NODE'
          const base='https://hohohosanta.app/api/cloud-trial/purchase';
          for(const [path,body] of [['checkout',{}],['session',{}],['start',{}]]){
            const r=await fetch(base+'/'+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),redirect:'error',signal:AbortSignal.timeout(20000)});
            const t=await r.text();
            console.log('GATE_DIAGNOSTIC',JSON.stringify({path,status:r.status,body:t.slice(0,800)}));
          }
          NODE
