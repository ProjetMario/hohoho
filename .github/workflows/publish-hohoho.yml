name: Publier HoHoHo Santa
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/publish-hohoho.yml]
permissions:
  contents: read
concurrency:
  group: hohohosanta-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ProjetMario/hohoho' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Lire le projet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Tester la procedure
        working-directory: deployment
        run: |
          node --check production-staged.mjs
          node --test test-publish.mjs
      - name: Revalider et publier le deploiement complet deja prepare
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node deployment/production-staged.mjs --publish 6ac4e7986db27e50c42c3ad2
      - name: Confirmer la publication controlee
        run: |
          printf '## Publication verifiee\nAccueil, logo et favicon publies sur https://hohohosanta.app. Les cinq fonctions de production, deux taches et la branche de base de donnees ont ete conserves. Huit pages et seize scripts verifies par GET. Aucun paiement ni appel de test declenche.\n' >> "$GITHUB_STEP_SUMMARY"
