name: Inspecter les archives Netlify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-runtime-recovery.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'ProjetMario/hohoho' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Tester la configuration d origine sur un brouillon isole
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, os, time, tomllib
          site='bd9b6590-f31a-42c7-b58d-12779e45cb0e'
          original='6ac36ead5077d61df784c7cd'
          base='https://api.netlify.com/api/v1'
          secret=os.environ['NETLIFY_AUTH_TOKEN']
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          client=urllib.request.build_opener(NoRedirect)
          def call(path,body=None,raw=False):
              headers={'Authorization':'Bearer '+secret,'Accept':'application/json'}
              if body is not None: headers['Content-Type']='application/json'
              if raw: headers['Content-Type']='application/vnd.bitballoon.v1.raw'
              req=urllib.request.Request(base+path,data=json.dumps(body).encode() if body is not None else None,headers=headers)
              with client.open(req,timeout=40) as r: return r.read().decode() if raw else json.load(r)
          s=call('/sites/'+site)
          assert s['id']==site and s['custom_domain']=='hohohosanta.app' and s['published_deploy']['id']==original
          d=call('/deploys/'+original)
          assert not d.get('functions_region_overrides')
          try:
              cfg=tomllib.loads(call('/deploys/'+original+'/files/netlify.toml',raw=True))
              funcs=cfg.get('functions',{})
              print('CONFIG_FUNCTIONS',json.dumps(funcs))
              print('CONFIG_REDIRECTS',json.dumps(cfg.get('redirects',[])))
              print('CONFIG_BUILD_COMMAND',cfg.get('build',{}).get('command'))
          except Exception as e: print('CONFIG_READ',type(e).__name__)
          files={f['path']:f['sha'] for f in call('/sites/'+site+'/files')}
          functions={}; configs={}
          for f in d['available_functions']:
              functions[f['n']]=f['d']
              c={}
              for a,b in [('dn','display_name'),('g','generator'),('bd','build_data'),('p','priority')]:
                  if f.get(a) is not None:c[b]=f[a]
              if f.get('ro'):
                  c['routes']=[{b:r[a] for a,b in [('p','pattern'),('l','literal'),('e','expression'),('m','methods'),('ps','prefer_static')] if r.get(a) is not None} for r in f['ro']]
              configs[f['n']]=c
          # Leave region/memory defaults implicit, matching the source's absence of region overrides.
          # No publication API is used by this diagnostic workflow.
          body={'files':files,'functions':functions,'functions_config':configs,'function_schedules':d.get('function_schedules',[]),'framework':d['framework'],'draft':True,'async':True}
          draft=call('/sites/'+site+'/deploys?title=Runtime%20reuse%20validation%20-%20no%20production%20change',body)
          print('ISOLATED_DRAFT',draft['id'])
          time.sleep(5)
          check=call('/deploys/'+draft['id'])
          print('RESULT',json.dumps({k:check.get(k) for k in ['id','state','required','required_functions','database_branch_id','functions_region_overrides']}))
          print('REUSED_FUNCTIONS',json.dumps([f.get('n') for f in check.get('available_functions',[])]))
          assert call('/sites/'+site)['published_deploy']['id']==original
          print('PRODUCTION_UNCHANGED')
          PY
